experiment_name: quantization_ecg_detection
description: ECG arrhythmia detection with INT8 quantization
version: "1.0.0"

# Data configuration
dataset_name: MIT-BIH
dataset_version: "1.0.0"
data_split_strategy: patient_aware_aami
test_size: 0.2
validation_size: 0.1
random_seed: 42
window_size: 180
sampling_rate: 360
normalization_method: zscore
remove_baseline_wander: true

# Model configuration
model_architecture: baseline_1d_cnn
input_shape: [180, 1]
num_classes: 1

# Training configuration
epochs: 10
batch_size: 128
optimizer: adam
learning_rate: 0.001
validation_split: 0.1
class_weight_method: balanced

# Optimization configuration
apply_pruning: false
pruning_sparsity: 0.0
apply_quantization: true
quantization_type: int8

# Evaluation configuration
metrics_to_report:
  - accuracy
  - precision
  - recall
  - f1_score
  - ami_sensitivity
  - ami_positive_predictivity
  - ami_effectiveness
  - specificity
confidence_level: 0.95
bootstrap_samples: 1000

# Output configuration
save_model: true
save_predictions: false
generate_plots: true